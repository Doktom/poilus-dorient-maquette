<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poilus d'Orient – Maquette 360°</title>
<style>
:root{--bg:#14171c;--panel:#fff;--ink:#1d232b;--mute:#6b7683;--line:#e4e8ed;
 --T2:#2bb673;--T3:#2f80ed;--T4:#f2994a;--T5:#9b51e0;--acc:#1d232b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;aspect-ratio:2560/1440;width:min(100vw,calc(100vh*2560/1440));max-height:100vh}
#wrap img,#wrap svg,#wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#wrap img{object-fit:fill;user-select:none;-webkit-user-drag:none}
#wrap canvas{user-select:none}
#ui{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:2560/1440;width:min(100vw,calc(100vh*2560/1440));max-height:100vh;pointer-events:none}
#ui>#ctl,#ui>#levels,#ui>#load{pointer-events:auto}
#wrap{touch-action:pan-y;cursor:grab}#wrap.drag{cursor:grabbing}
#ctl{position:absolute;left:14px;bottom:12px;display:flex;gap:8px}
#ctl .btn{background:rgba(255,255,255,.94);box-shadow:0 4px 18px rgba(0,0,0,.18)}
#levels{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.94);border-radius:14px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#levels small{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:center}
#levels button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:9px;min-width:62px;padding:7px 8px;font:700 13px system-ui;color:var(--ink);cursor:pointer;position:relative}
#levels button:hover{background:#f3f5f8}
#levels button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#levels button .n{position:absolute;top:-6px;right:-6px;background:var(--T4);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;box-shadow:0 1px 4px rgba(0,0,0,.3)}

#load{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(255,255,255,.94);border-radius:10px;padding:6px 12px;font-weight:600;font-size:12px}
.lot{fill-opacity:.32;stroke-width:3;stroke-linejoin:round;cursor:pointer;transition:fill-opacity .15s,stroke-width .15s;vector-effect:non-scaling-stroke;outline:none}
.lot:hover,.lot:focus-visible,.lot.on{fill-opacity:.58;stroke-width:4.5}
.lot{fill:var(--c,#f2994a);stroke:var(--c,#f2994a)}
.lot.flash{animation:flash .9s ease 3}
@keyframes flash{50%{fill-opacity:.85;stroke-width:8}}
#fade{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .45s ease}
#topr{display:flex;gap:8px;align-items:flex-start}
#legend .mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:4px}
#legend .mode button{appearance:none;border:0;background:#fff;padding:3px 8px;font:600 11.5px system-ui;color:var(--mute);cursor:pointer}
#legend .mode button.on{background:var(--acc);color:#fff}
#bLots{appearance:none;border:0;font:700 13px system-ui;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center}
/* liste des lots */
#list{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(370px,92vw);background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,.3);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
#list.open{transform:none}
#list header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#list header h3{margin:0;font-size:16px;flex:1}
#filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
#filters button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font:600 12.5px system-ui;color:var(--ink);cursor:pointer}
#filters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#rows{overflow:auto;flex:1;padding:6px 8px 14px}
.row-lot{display:grid;grid-template-columns:42px 1fr auto;gap:2px 10px;align-items:center;padding:10px 8px;border-radius:10px;cursor:pointer}
.row-lot:hover,.row-lot:focus-visible{background:#f3f5f8;outline:none}
.row-lot .num{grid-row:1/3;grid-column:1;width:42px;height:42px;border-radius:10px;color:#fff;font:800 17px system-ui;display:flex;align-items:center;justify-content:center}
.row-lot b{font-size:14.5px}.row-lot small{color:var(--mute);font-size:12px}
.row-lot .num{grid-column:1}.row-lot b,.row-lot small{grid-column:2}
.row-lot .go{grid-column:3;grid-row:1/3;font:600 12px system-ui}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px;color:#fff}
#rows .empty{color:var(--mute);text-align:center;padding:30px 10px}
/* zoom des images de la fiche */
.zoom{position:relative;overflow:hidden;touch-action:none;cursor:zoom-in}
.zoom.z{cursor:grab}.zoom img{transform-origin:0 0;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.zoom .zh{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.zoom .zh button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.95);border-radius:8px;width:32px;height:32px;font:700 16px system-ui;cursor:pointer}
.zoom .hint{position:absolute;left:10px;bottom:12px;font-size:11.5px;color:var(--mute);background:rgba(255,255,255,.9);border-radius:6px;padding:2px 7px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--acc);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;z-index:20;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#tour{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:20px;padding:6px 14px;font-weight:700;font-size:13px;display:none;pointer-events:auto;cursor:pointer}
#tour.on{display:block}
/* ecran de chargement */
#splash{position:fixed;inset:0;z-index:30;background:#f6f4f9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash b{font-size:22px;letter-spacing:.01em}#splash small{color:var(--mute)}
#splash .bar{width:min(280px,70vw);height:6px;border-radius:6px;background:#e4e8ed;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* aide au premier usage */
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;background:rgba(29,35,43,.82);color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;transition:opacity .4s}
#hint.out{opacity:0}
#hint .hand{display:inline-block;font-size:22px;animation:swipe 1.6s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
/* boussole */
#compass{width:40px;height:40px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
#compass svg{width:34px;height:34px;transition:none}
/* galerie de perspectives */
#gal{position:fixed;inset:0;z-index:12;background:#fff;display:none;flex-direction:column}
#gal.open{display:flex}
#gal header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#gal header h2{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gal header small{color:var(--mute);font-weight:600}
#g-main{flex:1;min-height:0;position:relative;display:flex}
#g-main .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff}
#g-main .pic img{max-width:100%;max-height:100%;object-fit:contain}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.95);font:700 20px system-ui;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#g-prev{left:12px}#g-next{right:12px}
#g-thumbs{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;border-top:1px solid var(--line);justify-content:safe center}
#g-thumbs button{appearance:none;border:2px solid transparent;border-radius:8px;padding:0;background:#fff;cursor:pointer;opacity:.6;flex:none}
#g-thumbs button.on{opacity:1;border-color:var(--ink)}
#g-thumbs img{height:58px;width:auto;display:block;border-radius:6px}
#b3d{font:700 13px system-ui;color:var(--ink);text-decoration:none;display:flex;gap:6px;align-items:center}
#bPersp{appearance:none;border:0;font:700 13px system-ui;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center}
/* fiche : lot precedent / suivant, vues interieures */
#m-prev,#m-next{padding:7px 10px}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.95);font:700 18px system-ui;cursor:pointer}
.v-prev{left:10px}.v-next{right:10px}
#view .pic{position:relative}
@media (prefers-reduced-motion:reduce){#hint .hand{animation:none}}
.lbs{display:none}
.pin{pointer-events:none;font:800 38px system-ui;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:9px;stroke-linejoin:round;text-anchor:middle}
@media (max-width:700px){.pin{font-size:56px}}
#svg:has(.lot.on) .lot:not(.on){fill-opacity:.12}
/* en-tête + légende */
#top{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.chip{pointer-events:auto;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:12px;padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.chip b{display:block;font-size:15px}.chip small{color:var(--mute)}
#legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
#legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* info-bulle */
#tip{position:fixed;z-index:5;pointer-events:none;width:230px;background:var(--panel);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip.touch{pointer-events:auto;position:fixed;left:50%!important;top:auto!important;bottom:14px;transform:translateX(-50%);width:min(92vw,340px);cursor:pointer}
.tip-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;color:#fff;font-weight:700}
.tip-b{padding:9px 12px 10px}
.tip-b .big{font-size:20px;font-weight:700}
.tip-b .row{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;margin-top:2px}
.tip-b .row b{color:var(--ink)}
.cta{margin-top:8px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:6px}
/* fiche */
#modal{position:fixed;inset:0;z-index:10;background:rgba(10,12,16,.66);display:none;align-items:center;justify-content:center;padding:2.5vh 2.5vw}
#modal.open{display:flex}
#card{background:var(--panel);width:min(1280px,100%);height:min(860px,100%);border-radius:16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#hd{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
#hd h2{margin:0;font-size:18px}
.badge{color:#fff;font-weight:700;border-radius:8px;padding:3px 9px}
#hd .sp{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font:600 13px inherit;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:#f3f5f8}
.btn.dark{background:var(--acc);color:#fff;border-color:var(--acc)}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
#tabs button{appearance:none;border:0;background:none;padding:9px 12px;font:600 13px inherit;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
#tabs button.on{color:var(--ink);border-color:var(--ink)}
#view{flex:1;min-height:0;position:relative;background:#f4f6f8;display:flex;flex-direction:column}
#view iframe{flex:1;border:0;width:100%}
#view .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
#view .pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#thumbs{display:flex;gap:8px;padding:8px 10px;overflow-x:auto;background:#fff;border-top:1px solid var(--line)}
#thumbs img{height:64px;width:auto;border-radius:6px;cursor:pointer;opacity:.6;border:2px solid transparent}
#thumbs img.on{opacity:1;border-color:var(--ink)}
#side{border-left:1px solid var(--line);overflow:auto;padding:14px 16px;min-height:0}
#side h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#side table{width:100%;border-collapse:collapse;margin-bottom:16px}
#side td{padding:5px 0;border-bottom:1px solid var(--line)}
#side td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#side tr.tot td{font-weight:700;font-size:15px;border-bottom:2px solid var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.kpi{background:#f4f6f8;border-radius:10px;padding:8px 10px}.kpi small{color:var(--mute);display:block}.kpi b{font-size:17px}
.note{color:var(--mute);font-size:11.5px}
/* smartphone / tablette en portrait : vue agrandie qui suit le batiment, commandes hors de l'image */
@media (max-aspect-ratio:1/1){
 html,body,#stage{background:#f6f4f9}
 #stage{display:block}
 #wrap{position:absolute;left:0;top:50%;width:auto;height:min(62vh,calc(220vw*1440/2560));max-height:none;transform:translateY(-50%);transition:transform .12s linear}
 #ui{inset:0;left:0;top:0;transform:none;width:auto;aspect-ratio:auto;max-height:none}
 #top{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));flex-direction:row;gap:8px}
 .chip{padding:7px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}.chip b{font-size:14px}.chip small{font-size:11.5px}
 #legend{flex-shrink:0}
 #levels{top:auto;right:auto;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;padding:6px;gap:5px}
 #levels small{display:none}
 #levels button{min-width:46px;padding:9px 6px;font-size:13px}
 #ctl{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:max-content}
 #ctl .btn,#levels{white-space:nowrap}
 #levels{width:max-content}
 #ctl .btn{padding:10px 12px}
 #ctl .lbl{display:none}#ctl .lbs{display:inline}
 #topr{flex-direction:column;align-items:flex-end}
 #legend .mode button{padding:5px 8px}
 #list{top:auto;left:0;right:0;width:auto;height:72vh;border-radius:16px 16px 0 0;transform:translateY(105%)}
 #tour{top:auto;bottom:calc(126px + env(safe-area-inset-bottom))}
 #compass{width:42px;height:42px}
 .g-nav{width:40px;height:40px}#g-thumbs img{height:46px}
 #gal header h2{font-size:15px}
 #load{bottom:auto;top:calc(50% + min(31vh,calc(110vw*1440/2560)) + 4px)}
}
/* telephone en paysage : commandes compactes */
@media (max-height:500px) and (min-aspect-ratio:1/1){
 .chip{padding:5px 9px}.chip b{font-size:13px}.chip small{font-size:11px}
 #levels{padding:5px;gap:4px}#levels small{display:none}
 #levels button{min-width:44px;padding:6px 6px;font-size:12px}
 #ctl .btn{padding:5px 10px;font-size:12px}
 #top{top:8px;left:8px;right:8px}#ctl{left:8px;bottom:8px}
}
@media (max-width:860px){
 #card{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
 #side{border-left:0;border-top:1px solid var(--line);max-height:38vh}
}
@media (max-width:600px){#m-share .t,#g-360 .t{display:none}#hd h2{font-size:15px}}
@media (max-width:860px){#modal{padding:0}#card{border-radius:0}#hd{flex-wrap:wrap;gap:8px}#hd .sp{display:none}#hd h2{font-size:16px;flex:1}#m-dl{order:5;width:100%;justify-content:center}#tabs{overflow-x:auto}#thumbs img{height:52px}}
@media (max-height:500px) and (min-aspect-ratio:1/1){
 html,body,#stage{background:#f6f4f9}
 #card{grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:auto minmax(0,1fr);height:100%}
 #side{border-left:1px solid var(--line);border-top:0;max-height:none;padding:10px 12px}
 #hd{flex-wrap:nowrap;padding:6px 10px}#hd h2{font-size:14px}#m-dl{order:0;width:auto;padding:5px 9px;font-size:12px}#m-close{padding:5px 9px}
 #tabs{padding:2px 8px 0}#tabs button{padding:6px 10px}
 #view .pic{padding:4px}#thumbs{padding:4px 8px}#thumbs img{height:40px}
 .kpis{gap:6px;margin-bottom:10px}.kpi{padding:6px 8px}.kpi b{font-size:15px}
}
</style>
</head>
<body>
<div id="stage">
 <div id="wrap">
  <canvas id="frame" width="1920" height="1080" role="img" aria-label="Maquette 360°"></canvas>
  <svg id="svg" viewBox="0 0 2560 1440" preserveAspectRatio="none"></svg>
 </div>
 <div id="ui">
  <div id="top">
   <div class="chip"><b id="h-title"></b><small id="h-sub"></small></div>
   <div id="topr"><div class="chip" id="legend"></div><button class="chip" id="bLots" aria-haspopup="dialog">☰ Lots <span id="nl"></span></button><button class="chip" id="bPersp" aria-haspopup="dialog">🖼 Perspectives</button><a class="chip" id="b3d" target="_blank" rel="noopener">🧊 Maquette 3D</a></div>
  </div>
  <div id="tour" role="status">Visite guidée · toucher pour arrêter</div>
  <div id="ctl"><button class="btn" id="prev" aria-label="Tourner à gauche">◀</button><button class="btn" id="next" aria-label="Tourner à droite">▶</button><button class="btn" id="auto" aria-label="Rotation auto">⟳<span class="lbl"> Rotation auto</span></button><button class="btn" id="bTour" aria-label="Visite guidée">▶<span class="lbl"> Visite guidée</span><span class="lbs"> Visite</span></button><button class="btn" id="compass" aria-label="Revenir face à la rue" title="Revenir face à la rue"><svg viewBox="-20 -20 40 40" aria-hidden="true"><circle r="18" fill="#fff" stroke="#e4e8ed" stroke-width="2"/><g id="cneedle"><path d="M0-15 L5 0 L0 3 L-5 0Z" fill="#c0392b"/><text y="13" text-anchor="middle" font-size="7.5" font-weight="800" fill="#1d232b" font-family="system-ui">RUE</text></g></svg></button><button class="btn" id="bFull" aria-label="Plein écran" title="Plein écran">⛶</button></div>
  <div id="levels" role="group" aria-label="Choix de l'étage"><small>Étages</small></div>
  <div id="load">Chargement des vues…</div>
  <div id="hint" aria-hidden="true"><span class="hand">👆</span><span id="hint-t">Glissez pour faire tourner</span></div>
 </div>
</div>
<div id="tip" role="tooltip"></div>
<aside id="list" aria-hidden="true" aria-label="Liste des lots"><header><h3>Les lots</h3><button class="btn" id="l-close" aria-label="Fermer">✕</button></header><div id="filters"></div><div id="rows"></div></aside>
<div id="toast" role="status"></div>
<div id="splash" role="status" aria-live="polite"><b id="sp-t"></b><small id="sp-s">Chargement de la maquette…</small><div class="bar"><i id="sp-bar"></i></div></div>
<div id="gal" role="dialog" aria-modal="true" aria-label="Perspectives" aria-hidden="true">
 <header><h2 id="g-title"></h2><small id="g-count"></small><button class="btn" id="g-360">↻<span class="t"> Voir en</span> 360°</button><button class="btn dark" id="g-close" aria-label="Fermer">✕ Fermer</button></header>
 <div id="g-main"><button class="g-nav" id="g-prev" aria-label="Perspective précédente">‹</button><div class="pic zoom" id="g-pic"><img id="g-img" alt=""></div><button class="g-nav" id="g-next" aria-label="Perspective suivante">›</button></div>
 <div id="g-thumbs"></div>
</div>
<div id="modal" aria-hidden="true">
 <div id="card" role="dialog" aria-modal="true">

/* zoom des images de la fiche (molette, double-clic / double-appui, pincement, glisser) */
function zoomable(box){
  const img=box.querySelector("img");img.draggable=false;let s=1,x=0,y=0;const P=new Map();let pinch=null,last=null,tapT=0;
  box.insertAdjacentHTML("beforeend",`<div class="hint">${coarse?"Pincer ou toucher 2× pour zoomer":"Molette ou double-clic pour zoomer"}</div><div class="zh"><button data-z="1" aria-label="Zoomer">+</button><button data-z="-1" aria-label="Dézoomer">−</button></div>`);
  /* x, y : decalage de l'image (px) ; on garde l'image dans le cadre */
  const clamp=()=>{const r=box.getBoundingClientRect(),iw=img.offsetWidth*s,ih=img.offsetHeight*s,ox=img.offsetLeft,oy=img.offsetTop;
    if(s<=1.001){s=1;x=0;y=0;return}
    x=iw<=r.width?(r.width-iw)/2-ox:Math.min(-ox,Math.max(r.width-ox-iw,x));
    y=ih<=r.height?(r.height-ih)/2-oy:Math.min(-oy,Math.max(r.height-oy-ih,y))};
  const apply=()=>{clamp();img.style.transform=`translate(${x}px,${y}px) scale(${s})`;box.classList.toggle("z",s>1)};
  const zoomAt=(cx,cy,ns)=>{ns=Math.min(6,Math.max(1,ns));const b=box.getBoundingClientRect();
    const px=cx-b.left-img.offsetLeft,py=cy-b.top-img.offsetTop;   /* point vise, repere de l'image non transformee */

  box.querySelectorAll(".zh button").forEach(b=>b.onclick=e=>{e.stopPropagation();const r=box.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,s*(b.dataset.z>0?1.6:1/1.6))});
  box.addEventListener("pointerdown",e=>{if(e.target.closest(".zh"))return;try{box.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,[e.clientX,e.clientY]);
    if(P.size===2){const[a,b]=[...P.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,s}}else{last=[e.clientX,e.clientY];

  if(!silent)try{localStorage.setItem("poilus-hint","1")}catch(e){}}
$("#sp-t").textContent=PROG.name;
if(PROG.link3d)$("#b3d").href=PROG.link3d;else $("#b3d").remove();

/* perspectives exterieures (fond blanc) */
let gI=0,gZoomed=false;
function renderGal(){const p=PERSP[gI];
  $("#g-title").textContent=p.titre;$("#g-count").textContent=`${gI+1} / ${PERSP.length}`;
  const box=$("#g-pic");box.innerHTML=`<img id="g-img" src="${A(p.file)}" alt="${p.titre}">`;zoomable(box);
  $("#g-thumbs").innerHTML=PERSP.map((q,i)=>`<button class="${i===gI?"on":""}" data-i="${i}" aria-label="${q.titre}"><img src="${A(q.thumb)}" alt=""></button>`).join("");
  $("#g-thumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>{gI=+b.dataset.i;renderGal()});
  const on=$("#g-thumbs .on");on&&on.scrollIntoView({block:"nearest",inline:"center"});
  for(const d of [-1,1]){const im=new Image();im.src=A(PERSP[(gI+d+PERSP.length)%PERSP.length].file)}   /* precharge les voisines */
}
function galStep(d){gI=(gI+d+PERSP.length)%PERSP.length;renderGal()}
function openGal(i){stopAll();hideTip();hideHint(true);closeList();gI=i||0;renderGal();$("#gal").classList.add("open");$("#gal").setAttribute("aria-hidden","false");$("#g-close").focus()}
function closeGal(){$("#gal").classList.remove("open");$("#gal").setAttribute("aria-hidden","true")}
if(PERSP.length){
  $("#bPersp").onclick=()=>openGal(0);$("#g-close").onclick=closeGal;$("#g-prev").onclick=()=>galStep(-1);$("#g-next").onclick=()=>galStep(1);
  $("#g-360").onclick=()=>{const p=PERSP[gI],L=LEVELS.find(l=>l.id===p.niveau)||LEVELS[LEVELS.length-1];closeGal();setLevel(L);animateTo(shortest(p.image),900)};
  document.addEventListener("keydown",e=>{if(!$("#gal").classList.contains("open"))return;
    if(e.key==="ArrowLeft")galStep(-1);if(e.key==="ArrowRight")galStep(1);if(e.key==="Escape")closeGal()});
  /* balayage horizontal pour changer de perspective (si l'image n'est pas zoomee) */
  let gx=null;const gm=$("#g-main");
  gm.addEventListener("pointerdown",e=>{gx=($("#g-pic").classList.contains("z")||e.target.closest(".g-nav,.zh"))?null:[e.clientX,e.clientY]});
  gm.addEventListener("pointerup",e=>{if(!gx)return;const dx=e.clientX-gx[0],dy=e.clientY-gx[1];gx=null;if(Math.abs(dx)>50&&Math.abs(dx)>1.5*Math.abs(dy))galStep(dx<0?1:-1)});
}else $("#bPersp").remove();
route();
</script>
</body>
</html>
